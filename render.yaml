services:
  - type: web
    name: yetihomes-api
    rootDir: api
    runtime: node
    repo: https://github.com/SpitfireGG/yetihomes_backend
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CORS_ORIGINS
        value: https://yetihomes-admin.onrender.com,https://yetihomes-frontend.onrender.com
      # Render does not provide managed MySQL/MariaDB.
      # Set DATABASE_URL manually to your external MySQL/MariaDB connection string:
      # e.g. "mysql://user:password@host:3306/yeti_homes"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Yeti Homes <noreply@yetihomes.com>
      - key: ADMIN_EMAIL
        value: info@yetihomes.com

  - type: web
    name: yetihomes-admin
    rootDir: api/admin
    runtime: node
    repo: https://github.com/SpitfireGG/yetihomes_backend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: yetihomes-api
          property: host

# Note: Render does not offer managed MySQL/MariaDB.
# You need to host your own MariaDB instance or use an external provider.
# Remove the databases block above and set DATABASE_URL via env vars.

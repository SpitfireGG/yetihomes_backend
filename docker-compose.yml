services:
  postgres:
    image: postgres:16-alpine
    container_name: yetihomes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yeti_homes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: yetihomes-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/yeti_homes?schema=public"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma generate && npx prisma migrate deploy && node dist/main"

  admin:
    build:
      context: ./api/admin
      dockerfile: Dockerfile
    container_name: yetihomes-admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:

services:
  mariadb:
    image: mariadb:11
    container_name: yetihomes-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: postgres
      MYSQL_DATABASE: yeti_homes
      MYSQL_USER: yeti
      MYSQL_PASSWORD: postgres
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: yetihomes-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: "mysql://yeti:postgres@mariadb:3306/yeti_homes"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy
    command: >
      sh -c "npx prisma generate && npx prisma migrate deploy && node dist/src/main"

  admin:
    build:
      context: ./api/admin
      dockerfile: Dockerfile
    container_name: yetihomes-admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    depends_on:
      - api

volumes:
  dbdata:
  uploads:
